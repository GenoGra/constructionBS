  graph: true

supported_workflows:
  cactus: true
  minigraph: true
  minigraphcactus: true
  pggb: true
  lcpan: true
  progressivecactus: true

lcpan:
  reference_fasta: GRAPH/mhc_reference_pansn.fa
  variants_vcf: GRAPH/lcpan_MHC.vcf

reference_name: MHC-GRCh38

seqfile:
  sample_name_rewrites:
