# Tool references for reproducible container builds.
#
# ref  : human-readable version (git tag, or image tag) — documents WHICH version.
# pin  : the immutable identity the build actually uses — resolved 2026-07-02:
#          - source: image -> base image digest (sha256:...); pull is byte-stable.
#          - source: git   -> commit SHA the tag pointed to; clone+checkout is stable.
#        Regenerate Dockerfiles with make_dockerfiles.py after editing.
#
# apt package versions are intentionally NOT pinned (they vanish from Ubuntu
# repos on security updates and would break builds); out of scope for this pass.

